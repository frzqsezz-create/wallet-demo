<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10121a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Wallet Demo"><meta name="description" content="Fictional wallet simulator. No payments."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Wallet Demo</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;background:#10121a;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#202238 0%,#10121a 58%)}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 30px) 22px calc(env(safe-area-inset-bottom) + 36px)}header{display:flex;justify-content:space-between;align-items:start;margin-bottom:32px}h1{font-size:35px;letter-spacing:-1.5px;margin:0 0 7px}header p,.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.8px;color:#a5a7b9;margin:0}.wallet-icon{font-size:25px;color:#d5d7e4}.stack{height:322px;position:relative;touch-action:pan-y;user-select:none}.payment-card{position:absolute;inset:0 0 auto;height:225px;border-radius:24px;padding:23px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #ffffff30;box-shadow:0 18px 28px #0007;transition:transform .48s cubic-bezier(.2,.8,.2,1),filter .48s,opacity .48s;transform-origin:top center;text-align:left;width:100%;color:white;-webkit-tap-highlight-color:transparent}.payment-card:focus-visible{outline:3px solid white;outline-offset:3px}.payment-card::before{content:"";position:absolute;width:220px;height:220px;right:-85px;top:-110px;border-radius:50%;background:#ffffff16}.payment-card::after{content:"";position:absolute;width:225px;height:225px;right:-90px;bottom:-145px;border:24px solid #ffffff16;border-radius:50%}.aurora{background:linear-gradient(118deg,#6e4b19 0%,#d8ae59 27%,#f8e3a4 48%,#aa782f 74%,#f1d08a 100%);color:#33210b}.summit{background:linear-gradient(125deg,#9c7337,#f6df9a 32%,#bd8d40 61%,#6c471c);color:#33210b}.citrus{background:linear-gradient(120deg,#5b3b19,#c99c52 26%,#f7e6b2 55%,#9c6b31 85%);color:#33210b}.payment-card .demo-pill{background:#30200cbb;color:#fff}.payment-card .chip{border-color:#715a36;background:linear-gradient(140deg,#f7e6bd,#b59a5c)}.payment-card::before{background:#ffffff24}.payment-card::after{border-color:#ffffff24}.payment-card .issuer{color:#3d2a13}.card-head,.card-bottom{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.card-name{font-size:23px;font-weight:750}.wave{font-size:26px;transform:rotate(90deg)}.chip{position:relative;z-index:1;width:43px;height:31px;border-radius:7px;background:linear-gradient(140deg,#f4e6bf,#b8a984);border:1px solid #ffffff80}.chip:after{content:"";position:absolute;left:14px;top:0;bottom:0;border-left:1px solid #8b7c59}.digits{font-size:17px;font-weight:650;letter-spacing:2px}.issuer{font-size:10px;letter-spacing:1.8px;font-weight:750;margin-top:8px}.demo-pill{background:#0004;border-radius:20px;padding:7px 11px;font-size:11px;letter-spacing:1.5px;font-weight:800}.switcher{display:flex;justify-content:center;gap:8px;margin-top:-20px;margin-bottom:22px;position:relative}.dot{width:7px;height:7px;border-radius:50%;background:#5b5e71;border:0;padding:0}.dot.active{background:white;width:20px;border-radius:8px}.balance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:28px}.muted{font-size:14px;color:#9ea0b1}.balance{font-size:34px;font-weight:750;letter-spacing:-1.3px;margin-top:5px;font-variant-numeric:tabular-nums}.simulate{background:#ffffff22;border:1px solid #ffffff18;border-radius:50px;padding:13px 16px;color:#fff;font-size:14px;font-weight:700;white-space:nowrap}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}h2{font-size:21px;letter-spacing:-.5px;margin:0}.activity{display:grid;gap:10px}.transaction{display:flex;align-items:center;gap:13px;padding:14px;border-radius:18px;background:#ffffff0c}.transaction-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#ffffff15;font-size:21px;flex-shrink:0}.transaction-info{flex:1;min-width:0}.merchant{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#a3a4b4;margin-top:5px}.price{font-size:14px;font-weight:700;white-space:nowrap}.empty{color:#a3a4b4;padding:20px 0}.disclaimer{font-size:11px;color:#777b91;text-align:center;margin-top:35px}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:end;justify-content:center;z-index:20}.overlay.open{display:flex}.sheet{width:100%;max-width:520px;background:#222431;border-radius:25px 25px 0 0;padding:23px 22px calc(env(safe-area-inset-bottom) + 30px);box-shadow:0 -12px 45px #0008}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.sheet h2{font-size:20px}.link-button{background:none;border:0;color:#b6baff;font-size:15px;padding:8px 0}.field{display:block;margin:14px 0;font-size:13px;color:#c1c2d0}.field input{display:block;margin-top:8px;width:100%;background:#13151e;border:1px solid #414354;border-radius:13px;padding:15px;color:#fff;font-size:16px;outline:none}.field input:focus{border-color:#a6a9f5}.help{font-size:12px;color:#b2b4c1;line-height:1.5}.error{color:#ffb6b6;min-height:19px;font-size:13px}.primary{width:100%;padding:15px;border-radius:14px;background:#a9a6ff;border:0;color:#161624;font-weight:800;font-size:16px;margin-top:10px}.primary:disabled{opacity:.4}.reset{background:none;border:0;color:#a4a6ba;text-decoration:underline;font-size:12px;margin-top:15px;padding:8px 0}@media(prefers-reduced-motion:reduce){.payment-card{transition:none}}
</style></head><body><main class="app"><header><div><h1>My Wallet</h1><p>SIMULATION · NOT FOR PAYMENT</p></div><div class="wallet-icon" aria-hidden="true">▣</div></header><section aria-label="Fictional payment cards"><div class="stack" id="stack"></div><div class="switcher" id="switcher" aria-label="Choose a card"></div></section><section class="balance-row"><div><div class="muted">Demo balance</div><div class="balance" id="balance" aria-live="polite"></div></div><button class="simulate" id="simulate">＋ Simulate</button></section><section><div class="section-head"><h2>Recent activity</h2></div><div class="activity" id="activity"></div></section><p class="disclaimer">Gold-inspired fictional cards · Not affiliated with American Express · No payment capability</p><button class="reset" id="reset">Reset demo data</button></main><div class="overlay" id="overlay" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">Simulate purchase</h2><button class="link-button" id="cancel">Cancel</button></div><form id="purchase-form"><label class="field">Merchant name<input id="merchant" maxlength="60" required placeholder="e.g. Maple Cafe" autocomplete="off"></label><label class="field">Amount (CAD)<input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00"></label><p class="help">This changes demo data on this device only. No payment is made.</p><p class="error" id="error" role="alert"></p><button class="primary" type="submit">Add demo purchase</button></form></div></div><script>
(()=>{'use strict';const KEY='wallet-demo-pwa-v1';const initial=()=>({cards:[{name:'Gold · Classic',issuer:'GOLD-STYLE · DEMO',lastFour:'1042',theme:'aurora',cents:248075},{name:'Gold · Rose',issuer:'GOLD-STYLE · DEMO',lastFour:'8831',theme:'summit',cents:125000},{name:'Gold · Vintage',issuer:'GOLD-STYLE · DEMO',lastFour:'5916',theme:'citrus',cents:34020}],transactions:[{merchant:'Northside Coffee',category:'Food & Drink',cents:650,date:new Date().toISOString(),cardIndex:0},{merchant:'Metro Market',category:'Groceries',cents:4218,date:new Date(Date.now()-86400000).toISOString(),cardIndex:0},{merchant:'Cloud Cinema',category:'Entertainment',cents:1500,date:new Date(Date.now()-172800000).toISOString(),cardIndex:1}],selected:0});let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!Array.isArray(state.cards)||state.cards.length!==3||!Array.isArray(state.transactions))throw Error('Invalid');state.selected=Math.max(0,Math.min(2,Number(state.selected)||0));['Gold · Classic','Gold · Rose','Gold · Vintage'].forEach((n,i)=>{state.cards[i].name=n;state.cards[i].issuer='GOLD-STYLE · DEMO'})}catch{state=initial()}const $=id=>document.getElementById(id),money=cents=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(cents/100),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){const stack=$('stack'),dots=$('switcher');stack.replaceChildren();dots.replaceChildren();for(let offset=2;offset>=0;offset--){const i=(state.selected+offset)%3,c=state.cards[i],card=make('button','payment-card '+c.theme);card.type='button';card.setAttribute('aria-label','Select '+c.name+' demo card');card.style.transform=`translateY(${offset*29}px) scale(${1-offset*.045})`;card.style.zIndex=3-offset;card.style.filter=offset?'brightness('+(1-offset*.12)+')':'none';const head=make('div','card-head');head.append(make('span','card-name',c.name),make('span','wave','◖))'));const chip=make('div','chip');chip.setAttribute('aria-hidden','true');const bottom=make('div','card-bottom'),info=make('div');info.append(make('div','digits','••••  '+c.lastFour),make('div','issuer',c.issuer));bottom.append(info,make('div','demo-pill','DEMO'));card.append(head,chip,bottom);card.addEventListener('click',()=>select(i));stack.append(card)}state.cards.forEach((c,i)=>{const dot=make('button','dot'+(i===state.selected?' active':''));dot.type='button';dot.setAttribute('aria-label','Show '+c.name);dot.addEventListener('click',()=>select(i));dots.append(dot)});$('balance').textContent=money(state.cards[state.selected].cents);const activity=$('activity');activity.replaceChildren();const list=state.transactions.filter(t=>t.cardIndex===state.selected).sort((a,b)=>new Date(b.date)-new Date(a.date));if(!list.length)activity.append(make('p','empty','No demo transactions yet.'));for(const t of list){const row=make('div','transaction'),icon=make('div','transaction-icon','▣'),info=make('div','transaction-info'),date=new Date(t.date);info.append(make('div','merchant',t.merchant),make('div','meta',t.category+' · '+(isNaN(date)?'Demo':date.toLocaleDateString('en-CA',{month:'short',day:'numeric'}))));row.append(icon,info,make('div','price','−'+money(t.cents)));activity.append(row)}}function select(i){state.selected=i;save();render()}let touchX=null;$('stack').addEventListener('touchstart',e=>{touchX=e.touches[0]?.clientX??null},{passive:true});$('stack').addEventListener('touchend',e=>{if(touchX===null)return;const dx=(e.changedTouches[0]?.clientX??touchX)-touchX;touchX=null;if(Math.abs(dx)>45)select((state.selected+(dx<0?1:2))%3)},{passive:true});function close(){$('overlay').classList.remove('open');$('error').textContent='';$('purchase-form').reset()}$('simulate').addEventListener('click',()=>{$('overlay').classList.add('open');$('merchant').focus()});$('cancel').addEventListener('click',close);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('purchase-form').addEventListener('submit',e=>{e.preventDefault();const merchant=$('merchant').value.trim(),raw=$('amount').value,cents=Math.round(Number(raw)*100),available=state.cards[state.selected].cents;if(!merchant||!Number.isSafeInteger(cents)||cents<=0||cents>available){$('error').textContent='Enter a merchant and an amount within your demo balance.';return}state.cards[state.selected].cents-=cents;state.transactions.unshift({merchant,category:'Simulated purchase',cents,date:new Date().toISOString(),cardIndex:state.selected});save();render();close()});$('reset').addEventListener('click',()=>{if(confirm('Reset all fictional balances and transactions?')){state=initial();save();render()}});save();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script></body></html>
