<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Wallet Studio</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff}button{font:inherit;cursor:pointer}main{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 45px) 20px calc(env(safe-area-inset-bottom) + 40px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}h1{font-size:36px;letter-spacing:-1.3px;margin:0}button.circle{width:36px;height:36px;border:0;border-radius:50%;font-size:27px;line-height:1;background:#f4f4f7;color:#111}.stack{position:relative;height:370px;margin-bottom:20px}.card{position:absolute;left:0;right:0;height:220px;border-radius:17px;padding:22px;overflow:hidden;text-align:left;box-shadow:0 7px 18px #0009;transition:top .38s cubic-bezier(.2,.75,.2,1),transform .38s,filter .38s;display:block;width:100%;border:1px solid #ffffff50;color:#15100a}.card:nth-child(1){top:0}.card:nth-child(2){top:75px}.card:nth-child(3){top:150px}.card.active{transform:translateY(-5px)}.gold{background:linear-gradient(125deg,#ad7924,#f8e4a2 40%,#c89735 75%,#f7db85)}.navy{background:linear-gradient(130deg,#142c48,#07111e 60%,#254967);color:#fff}.prism{background:linear-gradient(115deg,#e9f1ff,#d5b5f4 38%,#ffd59d 75%,#f7c2d7)}.brand{font-weight:800;font-size:19px;letter-spacing:.6px}.gold .brand{font-family:Georgia,serif;font-size:18px;letter-spacing:1px}.centurion{position:absolute;top:66px;left:43%;font-size:70px;opacity:.22;filter:grayscale(1)}.chip{position:absolute;left:23px;bottom:58px;width:39px;height:30px;border-radius:6px;border:1px solid #796b4c;background:linear-gradient(120deg,#b6a479,#f4e3aa,#a68a58)}.digits{position:absolute;bottom:20px;left:23px;font-size:16px;letter-spacing:2px}.mini{position:absolute;right:20px;bottom:22px;font-size:10px;font-weight:800;letter-spacing:1.4px}.section-title{font-size:22px;margin:25px 0 14px}.details{display:none;animation:fade .3s ease}.details.show{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.detail-card{height:220px;position:relative;border-radius:17px;padding:22px;margin:12px 0 22px;overflow:hidden}.back{border:0;background:transparent;color:#fff;font-size:18px;padding:0 0 10px}.panel{background:#1c1c1e;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#aaa;font-size:14px}.amount{font-size:34px;font-weight:750;margin-top:6px}.tx{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3b3b3d;padding:15px 0;gap:10px}.tx:last-child{border:0}.tx small{display:block;color:#aaa;margin-top:4px}.tx strong{white-space:nowrap}.action{border:0;background:#f3f3f6;color:#111;padding:13px 17px;border-radius:22px;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.notice{font-size:11px;color:#858585;text-align:center;margin-top:32px}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:end;justify-content:center}.overlay.show{display:flex}.sheet{background:#222226;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 28px)}input,select{width:100%;border:1px solid #444;background:#303034;color:#fff;padding:14px;border-radius:12px;margin:8px 0;font-size:16px}.sheet h2{margin:0 0 14px}.sheet .actions{justify-content:flex-end}.empty{color:#aaa;padding:12px 0}.selected-caption{color:#aaa;font-size:13px;text-align:center;margin-top:0}
</style></head><body><main><div id="home"><header><h1>Wallet</h1><button class="circle" id="add" aria-label="Add simulated transaction">+</button></header><div class="stack" id="stack"></div><p class="selected-caption">Tap a card to open it</p></div><div id="details" class="details"><button class="back" id="back">‹ Wallet</button><div id="detailCard"></div><div class="panel"><div class="muted">Fictional balance · CAD</div><div class="amount" id="balance"></div></div><div class="actions"><button class="action" id="purchase">+ Add purchase</button><button class="action" id="reset">Reset card</button></div><h2 class="section-title">Latest Transactions</h2><div class="panel" id="transactions"></div></div><p class="notice">Wallet Studio · Fictional cards and simulated transactions only. Not affiliated with card issuers or Apple.</p></main><div class="overlay" id="overlay"><div class="sheet"><h2>Add a simulated purchase</h2><label>Card<select id="cardChoice"></select></label><label>Merchant<input id="merchant" placeholder="Coffee shop" maxlength="40"></label><label>Amount (CAD)<input id="price" type="number" min="0.01" max="99999" step="0.01" placeholder="12.50"></label><div class="actions"><button class="action" id="cancel">Cancel</button><button class="action" id="save">Save purchase</button></div></div></div><script>
const cards=[{id:'gold',name:'AMERICAN EXPRESS',kind:'Gold-inspired',last:'5916',cls:'gold',start:340.20},{id:'blue',name:'CHASE',kind:'Navy',last:'2841',cls:'navy',start:1260.00},{id:'color',name:'COLOR CARD',kind:'Prism',last:'7302',cls:'prism',start:875.65}];
const key='wallet-studio-v2';let saved;try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{saved={}};let tx=saved.tx||{},current=cards[0].id;function persist(){localStorage.setItem(key,JSON.stringify({tx}))}function money(n){return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n)}function balance(id){return cards.find(c=>c.id===id).start-(tx[id]||[]).reduce((s,t)=>s+t.amount,0)}function art(c){return `<div class="brand">${c.name}</div>${c.id==='gold'?'<div class="centurion" aria-hidden="true">◉</div>':''}<div class="chip"></div><div class="digits">•••• ${c.last}</div><div class="mini">${c.kind.toUpperCase()}</div>`}function renderStack(){document.getElementById('stack').innerHTML=cards.map(c=>`<button class="card ${c.cls}" data-id="${c.id}" aria-label="Open ${c.name} card">${art(c)}</button>`).join('');document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openCard(el.dataset.id)))}function openCard(id){current=id;const c=cards.find(x=>x.id===id);document.getElementById('home').style.display='none';document.getElementById('details').classList.add('show');document.getElementById('detailCard').innerHTML=`<div class="detail-card ${c.cls}">${art(c)}</div>`;document.getElementById('balance').textContent=money(balance(id));const rows=tx[id]||[];document.getElementById('transactions').innerHTML=rows.length?rows.map(t=>`<div class="tx"><div><b class="merchant-name"></b><small>${new Date(t.date).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})}</small></div><strong>−${money(t.amount)}</strong></div>`).join(''):'<div class="empty">No transactions yet.</div>';document.querySelectorAll('.merchant-name').forEach((el,i)=>el.textContent=rows[i].merchant)}function closeCard(){document.getElementById('details').classList.remove('show');document.getElementById('home').style.display='block'}const overlay=document.getElementById('overlay'),choice=document.getElementById('cardChoice');choice.innerHTML=cards.map(c=>`<option value="${c.id}">${c.name} •••• ${c.last}</option>`).join('');function showForm(){choice.value=current;overlay.classList.add('show')}document.getElementById('add').onclick=showForm;document.getElementById('purchase').onclick=showForm;document.getElementById('cancel').onclick=()=>overlay.classList.remove('show');document.getElementById('back').onclick=closeCard;document.getElementById('save').onclick=()=>{const merchant=document.getElementById('merchant').value.trim(),amount=Number(document.getElementById('price').value),id=choice.value;if(!merchant||!Number.isFinite(amount)||amount<=0||amount>99999){alert('Enter a merchant and a valid amount.');return}(tx[id]??=[]).unshift({merchant,amount:Math.round(amount*100)/100,date:new Date().toISOString()});persist();overlay.classList.remove('show');document.getElementById('merchant').value='';document.getElementById('price').value='';openCard(id)};document.getElementById('reset').onclick=()=>{if(confirm('Reset simulated transactions for this card?')){delete tx[current];persist();openCard(current)}};renderStack();
</script></body></html>
